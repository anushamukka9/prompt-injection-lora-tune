# Reference training config: Qwen2.5-0.5B-Instruct, single GPU.
# pilora-train uses these as defaults; this file exists so a run is
# reproducible from a checked-in artifact. CLI flags override everything.
model: Qwen/Qwen2.5-0.5B-Instruct
seed: 42
max_seq_length: 512

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  bias: none

training:
  learning_rate: 2.0e-4
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4   # effective batch 16
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  bf16: true

eval:
  max_new_tokens: 8
  split: test
