name: ci

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (test deps only, no GPU packages)
        run: |
          pip install -e ".[test]"
          pip install ruff
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
